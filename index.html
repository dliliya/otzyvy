<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Отзывы наших клиентов</title>
<meta name="description" content="Отзывы покупателей о нашем магазине воздушных шаров">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --text: #2f2622;
    --muted: #7d6f66;
    --gold: #a98760;
    --star: #f0b23c;
    --card: rgba(255, 255, 255, .72);
    --line: rgba(169, 135, 96, .25);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Montserrat", -apple-system, "Segoe UI", Arial, sans-serif;
    color: var(--text);
    line-height: 1.5;
    background: #f6e9dc url("bg.webp") no-repeat 80% top / cover fixed;
    min-height: 100vh;
  }
  .wrap { max-width: 960px; margin: 0 auto; padding: 0 16px; }

  /* Шапка */
  header { text-align: center; }
  .brand { display: flex; align-items: center; justify-content: center; gap: 14px; padding-top: 28px;
    color: var(--gold); }
  .brand .line { flex: 0 0 56px; height: 1px; background: var(--gold); opacity: .6; }
  .brand svg { width: 22px; height: 22px; }
  .tagline { text-align: center; font-size: 11px; letter-spacing: .28em; text-transform: uppercase;
    color: var(--gold); margin: 10px 0 0; }
  h1 { font-family: "Cormorant Garamond", Georgia, "Times New Roman", serif; font-weight: 500;
    font-size: clamp(38px, 7vw, 60px); line-height: 1.05; margin: 28px auto 14px; max-width: 520px; }
  .lead { font-size: 17px; max-width: 420px; margin: 0 auto 24px; color: #4a3d36; }

  .links { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-bottom: 24px; }
  .link { display: flex; align-items: center; gap: 12px; padding: 12px 18px; border-radius: 14px;
    text-decoration: none; min-width: 200px; text-align: left; border: 0; font-family: inherit;
    cursor: pointer; box-shadow: 0 4px 14px rgba(120, 90, 60, .12); }
  .link b { display: block; font-size: 16px; font-weight: 600; line-height: 1.2; }
  .link small { display: block; font-size: 12px; opacity: .85; line-height: 1.2; }
  .link.vk, .link.avito, .link.review { background: #fff; color: #1b1b1b; }
  .max-ico { width: 34px; height: 34px; flex: none; }
  .vk-ico { width: 34px; height: 34px; border-radius: 9px; background: #0077ff; color: #fff;
    display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px;
    letter-spacing: -.5px; flex: none; }
  .av-ico { width: 30px; height: 30px; display: grid; grid-template-columns: 1fr 1fr; gap: 3px;
    flex: none; padding: 2px; }
  .av-ico i { border-radius: 50%; display: block; }
  .av-ico i:nth-child(1) { background: #04e061; }
  .av-ico i:nth-child(2) { background: #148af4; }
  .av-ico i:nth-child(3) { background: #ff4053; }
  .av-ico i:nth-child(4) { background: #965eeb; }

  .summary { display: block; width: 100%; max-width: 560px; margin: 0 auto 24px; text-align: center;
    background: rgba(255, 255, 255, .45); border: 1px solid var(--line);
    border-radius: 18px; padding: 16px 32px; backdrop-filter: blur(6px); }
  .summary[hidden] { display: none; }
  .summary .row { display: flex; align-items: center; justify-content: center; gap: 10px; }
  .avg { font-size: 34px; font-weight: 600; }
  .stars { color: var(--star); letter-spacing: 2px; white-space: nowrap; }
  .stars .off { color: #e6d9cc; }
  .count { color: var(--muted); font-size: 13px; }

  /* Отзывы */
  .grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    padding-bottom: 40px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 16px;
    backdrop-filter: blur(6px); }
  .head { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
  .ava { width: 44px; height: 44px; border-radius: 50%; background: #ead9c6; color: var(--gold);
    display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 17px;
    flex: none; }
  .name { font-weight: 600; font-size: 15px; line-height: 1.2; }
  .date { color: var(--muted); font-size: 12px; }
  .card .stars { font-size: 15px; margin-bottom: 6px; }
  .product { color: var(--gold); font-size: 12px; margin-bottom: 6px; }
  .card p { margin: 0 0 10px; white-space: pre-line; font-size: 15px; }
  .photos { display: flex; gap: 8px; flex-wrap: wrap; }
  .photos img { width: 84px; height: 84px; object-fit: cover; border-radius: 10px; cursor: zoom-in;
    border: 1px solid var(--line); }
  .empty { text-align: center; color: var(--muted); padding: 40px 0; }

  .lightbox { position: fixed; inset: 0; background: rgba(0, 0, 0, .85); display: none;
    align-items: center; justify-content: center; padding: 16px; z-index: 10; cursor: zoom-out; }
  .lightbox.on { display: flex; }
  .lightbox img { max-width: 100%; max-height: 100%; border-radius: 8px; }
  footer { text-align: center; color: var(--muted); font-size: 13px; padding: 0 0 40px; }

  @media (max-width: 700px) {
    body { background-position: 100% top; background-size: auto 100vh; }
  }
  @media (max-width: 520px) {
    .link { width: 100%; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <span class="line"></span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 20.5C6 16 3 12.8 3 9.2 3 6.7 4.9 5 7.2 5c1.9 0 3.9 1.1 4.8 3.1C12.9 6.1 14.9 5 16.8 5 19.1 5 21 6.7 21 9.2c0 3.6-3 6.8-9 11.3z"/>
      </svg>
      <span class="line"></span>
    </div>
    <p class="tagline">Воздушные шары · Декор · Эмоции</p>

    <h1>Отзывы<br>наших клиентов</h1>
    <p class="lead">Настоящие отзывы покупателей. Публикуем только с их согласия.</p>

    <div class="links">
      <!-- Замените три ссылки на свои -->
      <a class="link vk" href="https://vk.com/ВАША_ГРУППА">
        <span class="vk-ico">VK</span>
        <span><b>ВКонтакте</b><small>Каталог</small></span>
      </a>
      <a class="link avito" href="https://www.avito.ru/ВАШ_ПРОФИЛЬ">
        <span class="av-ico"><i></i><i></i><i></i><i></i></span>
        <span><b>Авито</b><small>Наши объявления</small></span>
      </a>
      <a class="link review" href="https://max.ru/se13903708_1_bot">
        <svg class="max-ico" viewBox="0 0 34 34" aria-hidden="true">
          <defs>
            <linearGradient id="maxg" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#2fb8ff"/>
              <stop offset="1" stop-color="#8a4dff"/>
            </linearGradient>
          </defs>
          <rect width="34" height="34" rx="10" fill="url(#maxg)"/>
          <path d="M17 7.5c-5.2 0-9.3 3.9-9.3 8.8 0 2.4 1 4.6 2.7 6.2-.1 1.1-.6 2.3-1.5 3.3 1.8 0 3.4-.7 4.6-1.6 1.1.4 2.3.6 3.5.6 5.2 0 9.3-3.9 9.3-8.8S22.200 7.500 17 7.500z" fill="#fff"/>
        </svg>
        <span><b>Оставить отзыв</b><small>в мессенджере Max</small></span>
      </a>
    </div>

    <div class="summary" id="summary" hidden>
      <div class="row">
        <span class="avg" id="avg"></span>
        <span class="stars" id="avgStars"></span>
      </div>
      <div class="count" id="count"></div>
    </div>
  </header>

  <main>
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" hidden>Скоро здесь появятся отзывы.</div>
  </main>

  <footer>Хотите оставить отзыв? Нажмите кнопку выше, она откроет нашего бота в Max.</footer>
</div>

<div class="lightbox" id="lightbox"><img alt=""></div>

<!-- reviews.js: отзывы, которые ты добавляешь руками. reviews-auto.js: пишет бот. -->
<script src="reviews.js"></script>
<script src="reviews-auto.js"></script>
<script>
  var reviews = (window.REVIEWS || []).concat(window.REVIEWS_AUTO || []).sort(function (a, b) {
    return b.date.localeCompare(a.date);
  });

  function stars(n) {
    var s = "";
    for (var i = 1; i <= 5; i++) s += i <= n ? "★" : '<span class="off">★</span>';
    return s;
  }
  function esc(t) {
    return String(t == null ? "" : t).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }
  function fmtDate(iso) {
    var d = new Date(iso);
    return isNaN(d) ? iso : d.toLocaleDateString("ru-RU", { day: "numeric", month: "long", year: "numeric" });
  }
  function plural(n, a, b, c) {
    var m = n % 100, k = n % 10;
    if (m > 10 && m < 20) return c;
    if (k === 1) return a;
    if (k >= 2 && k <= 4) return b;
    return c;
  }

  var grid = document.getElementById("grid");
  if (!reviews.length) {
    document.getElementById("empty").hidden = false;
  } else {
    var sum = reviews.reduce(function (s, r) { return s + r.rating; }, 0);
    var avg = sum / reviews.length;
    document.getElementById("avg").textContent = avg.toFixed(1).replace(".", ",");
    document.getElementById("avgStars").innerHTML = stars(Math.round(avg));
    document.getElementById("count").textContent =
      "на основе " + reviews.length + " " + plural(reviews.length, "отзыва", "отзывов", "отзывов");
    document.getElementById("summary").hidden = false;

    grid.innerHTML = reviews.map(function (r) {
      var photos = (r.photos || []).map(function (p) {
        return '<img src="photos/' + esc(p) + '" alt="Фото из отзыва" loading="lazy">';
      }).join("");
      return '<article class="card">' +
        '<div class="head"><div class="ava">' + esc(r.name.charAt(0)) + '</div>' +
        '<div><div class="name">' + esc(r.name) + '</div>' +
        '<div class="date">' + esc(fmtDate(r.date)) + '</div></div></div>' +
        '<div class="stars">' + stars(r.rating) + '</div>' +
        (r.product ? '<div class="product">' + esc(r.product) + '</div>' : "") +
        '<p>' + esc(r.text) + '</p>' +
        (photos ? '<div class="photos">' + photos + '</div>' : "") +
        '</article>';
    }).join("");
  }

  var lb = document.getElementById("lightbox");
  grid.addEventListener("click", function (e) {
    if (e.target.tagName === "IMG") {
      lb.querySelector("img").src = e.target.src;
      lb.classList.add("on");
    }
  });
  lb.addEventListener("click", function () { lb.classList.remove("on"); });
</script>
</body>
</html>
